# Addon over plain HTTP on port 7000.
# For HTTPS with automatic Let's Encrypt certificates use docker-compose.https.yml instead.
#
#   cp .env.example .env    # then edit it
#   docker compose up -d --build

services:
  addon:
    build: .
    image: webtorrentio:latest
    restart: unless-stopped
    env_file: .env
    # Time to finish streams and save the header/index cache after SIGTERM.
    stop_grace_period: 30s
    ports:
      - "7000:7000"
      - "6881:6881/tcp"
      - "6881:6881/udp"
      - "6882:6882/udp"
    volumes:
      - torrent-data:/data
      # Users and limits saved by the TUI dashboard, header/index cache, admin socket.
      - addon-state:/app/state
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  torrent-data:
  addon-state:
