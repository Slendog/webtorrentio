# Your deployment. Copy this folder to k8s/local (ignored by git), set DOMAIN, then:
#   kubectl apply -k k8s/local
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../overlays/traefik

components:
  # Optional: incoming peer connections on the node's ports 6881/6882.
  # - ../components/hostport
  # Keep last: applies DOMAIN below to the Ingress and PUBLIC_URL.
  - ../components/domain

configMapGenerator:
  - name: webtorrentio-config
    behavior: merge
    literals:
      - DOMAIN=stremio.example.org
      # Any other setting from the README's "Configuration" table, for example:
      # - MAX_DISK_GB=100
      # - SCRAPERS=yts,eztv
